[package]
name = "fs-people-client"
description = "Client of the people contract (people.capnp): People and RoleBook of fs-people-core over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.32.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
# Without it the parser can be one step off a double, as in the core.
serde_json = { version = "1", features = ["float_roundtrip"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

[dev-dependencies]
fs-people-server = { path = "../fs-people-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
