[package]
name = "fs-people-server"
description = "Cap'n Proto server of FreeSynergy people: the contract people.capnp over a Unix socket, in front of any People provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_people_server"

[dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
rustix = { version = "1", features = ["process"] }
capnp-rpc = "0.27"
serde_json = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
