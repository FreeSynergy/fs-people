[package]
name = "fs-people-core"
description = "Program core of FreeSynergy people: JSContact cards over fs-store, vCard import/export, same-person proposals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# Last MIT/Apache version before Stalwart moved later releases to AGPL: pinned exactly (see DESIGN.md).
calcard = "=0.3.14"
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.22.0" }
serde = { version = "1", features = ["derive"] }
# Numbers stay as they came: `details` and unknown card properties are lossless.
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
tempfile = "3"
