[package]
name = "fs-people-app"
description = "The people program of FreeSynergy, first window: list, search, read, create, edit and delete people, vCard in and out, on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.2" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.2" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.13", features = ["rpc"] }
capnp = "0.27"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
fs-people-server = { path = "../fs-people-server" }
tempfile = "3"
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.2" }
