[package]
name = "fs-people-app"
description = "The people program of FreeSynergy, first window: list, search, read, create, edit and delete people, vCard in and out, on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "817b8e85c72264fcf886af14e51d1a6cd35e0f63" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "817b8e85c72264fcf886af14e51d1a6cd35e0f63" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", rev = "817b8e85c72264fcf886af14e51d1a6cd35e0f63" }
