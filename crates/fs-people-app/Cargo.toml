[package]
name = "fs-people-app"
description = "The people program of FreeSynergy, first window: list, search, read, create, edit and delete people, vCard in and out, on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The window writes what is typed into its fields to `FS_TEST_ACCESS_FILE` (fs-components `test-access`). ONLY for the
# typing test, in a debug build: fs-components refuses the feature in a release build (compile_error), and no release
# manifest of ours turns it on.
test-access = ["fs-components-app/test-access"]

[dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.11" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.11" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.11" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
capnp = "0.27"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
fs-people-server = { path = "../fs-people-server" }
tempfile = "3"
capnp-rpc = "0.27"
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.11" }
