[package]
name = "fs-people-cli"
description = "Command line of FreeSynergy people: a second user of people.capnp, next to the MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_people_cli"

[dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.14", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-people-server = { path = "../fs-people-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
