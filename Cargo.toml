[workspace]
resolver = "2"
members = ["crates/fs-people-core", "crates/fs-people-server", "crates/fs-people-app", "crates/fs-people-cli", "crates/fs-people"]

[workspace.package]
version = "0.0.5"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-people"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Window resize crash (wgpu validation error when the window is enlarged); see fs-store/DESIGN.md.
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix" }
