[workspace]
resolver = "2"
members = ["crates/fs-people-core", "crates/fs-people-server", "crates/fs-people-app", "crates/fs-people-cli", "crates/fs-people"]

[workspace.package]
version = "0.0.12"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-people"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
# Blinc lives in one place only: fs-components (`fs_components::blinc`). See fs-release DESIGN.md, check_blinc.
blinc = "components-only"
